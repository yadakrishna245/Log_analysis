{% extends "base.html" %}
{% block title %}Tickets - LogSherlock Pro{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Tickets</h2>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newTicketModal">
        <i class="bi bi-plus-lg"></i> New Ticket
    </button>
</div>
<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover" id="tickets-table">
                <thead><tr><th>ID</th><th>Title</th><th>Status</th><th>Priority</th><th>Product</th><th>Created</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
