  <rect x="50" y="290" width="700" height="50" rx="6" fill="#0f3460" stroke="#2ed573" stroke-width="0.5"/>
  <circle cx="75" cy="315" r="10" fill="#2ed573" opacity="0.3"/>
  <text x="95" y="310" fill="#e0e0e0" font-family="Arial" font-size="11" font-weight="bold">DISK_SPACE_WARNING</text>
  <text x="95" y="327" fill="#e0e0e0" font-family="Arial" font-size="9">Filesystem usage exceeding threshold</text>
