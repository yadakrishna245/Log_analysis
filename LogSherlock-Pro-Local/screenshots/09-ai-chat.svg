<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#1a1a2e"/>
  <text x="400" y="40" text-anchor="middle" fill="#01a982" font-family="Arial" font-size="20" font-weight="bold">AI Chat Interface</text>
  <rect x="30" y="60" width="740" height="420" rx="8" fill="#16213e" stroke="#01a982" stroke-width="1"/>
  <!-- User message -->
  <rect x="300" y="80" width="430" height="60" rx="8" fill="#0f3460"/>
  <circle cx="710" cy="110" r="15" fill="#70a1ff"/>
  <text x="710" y="114" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="10">U</text>
  <text x="320" y="100" fill="#e0e0e0" font-family="Arial" font-size="11">Why did the server crash at 3AM?</text>
  <text x="320" y="118" fill="#e0e0e0" font-family="Arial" font-size="11">Show me the root cause.</text>
  <text x="320" y="133" fill="#70a1ff" font-family="Arial" font-size="9">2:34 PM</text>
  <!-- AI response -->
  <rect x="50" y="160" width="500" height="180" rx="8" fill="#01a982" opacity="0.1" stroke="#01a982" stroke-width="0.5"/>
  <circle cx="70" cy="180" r="15" fill="#01a982"/>
  <text x="70" y="184" text-anchor="middle" fill="#1a1a2e" font-family="Arial" font-size="10">AI</text>
  <text x="95" y="185" fill="#01a982" font-family="Arial" font-size="10" font-weight="bold">LogSherlock AI</text>
  <text x="95" y="210" fill="#e0e0e0" font-family="Arial" font-size="11">Based on analysis of 3,421 log entries:</text>
  <text x="95" y="235" fill="#e0e0e0" font-family="Arial" font-size="11">1. Memory usage hit 98% at 02:58 UTC</text>
  <text x="95" y="255" fill="#e0e0e0" font-family="Arial" font-size="11">2. OOM killer triggered at 03:01 UTC</text>
  <text x="95" y="275" fill="#e0e0e0" font-family="Arial" font-size="11">3. Java heap grew from 2GB to 7.8GB</text>
  <text x="95" y="300" fill="#ff4757" font-family="Arial" font-size="11" font-weight="bold">Root Cause: Memory leak in SessionManager</text>
  <text x="95" y="320" fill="#2ed573" font-family="Arial" font-size="10">Confidence: 94% | Evidence: 12 correlated events</text>
  <!-- Suggestions -->
  <rect x="50" y="360" width="200" height="30" rx="6" fill="#0f3460" stroke="#01a982"/>
  <text x="150" y="379" text-anchor="middle" fill="#01a982" font-family="Arial" font-size="10">Show timeline</text>
  <rect x="260" y="360" width="200" height="30" rx="6" fill="#0f3460" stroke="#01a982"/>
  <text x="360" y="379" text-anchor="middle" fill="#01a982" font-family="Arial" font-size="10">Generate fix suggestion</text>
  <rect x="470" y="360" width="200" height="30" rx="6" fill="#0f3460" stroke="#01a982"/>
  <text x="570" y="379" text-anchor="middle" fill="#01a982" font-family="Arial" font-size="10">Create Jira ticket</text>
  <!-- Input box -->
  <rect x="50" y="420" width="620" height="40" rx="8" fill="#0f3460" stroke="#2a2a4a"/>
  <text x="70" y="444" fill="#e0e0e0" opacity="0.5" font-family="Arial" font-size="11">Ask about your logs...</text>
  <rect x="680" y="420" width="80" height="40" rx="8" fill="#01a982"/>
  <text x="720" y="444" text-anchor="middle" fill="#1a1a2e" font-family="Arial" font-size="11" font-weight="bold">Send</text>
</svg>