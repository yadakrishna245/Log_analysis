<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#1a1a2e"/>
  <text x="400" y="40" text-anchor="middle" fill="#01a982" font-family="Arial" font-size="20" font-weight="bold">Before vs After Analysis</text>
  <rect x="30" y="60" width="740" height="420" rx="8" fill="#16213e" stroke="#01a982" stroke-width="1"/>
  <!-- Before panel -->
  <rect x="50" y="80" width="340" height="380" rx="8" fill="#0f3460" stroke="#ff4757"/>
  <text x="220" y="105" text-anchor="middle" fill="#ff4757" font-family="Arial" font-size="14" font-weight="bold">BEFORE</text>
  <text x="220" y="125" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="10">23 Critical Findings</text>
  <rect x="70" y="140" width="280" height="30" rx="4" fill="#ff4757" opacity="0.2"/>
  <text x="80" y="159" fill="#ff4757" font-family="Arial" font-size="10">SSH Brute Force — 47 attempts</text>
  <rect x="70" y="180" width="280" height="30" rx="4" fill="#ff4757" opacity="0.2"/>
  <text x="80" y="199" fill="#ff4757" font-family="Arial" font-size="10">Privilege Escalation — sudo exploit</text>
  <rect x="70" y="220" width="280" height="30" rx="4" fill="#ffa502" opacity="0.2"/>
  <text x="80" y="239" fill="#ffa502" font-family="Arial" font-size="10">Disk Space 95% — /var/log</text>
  <rect x="70" y="260" width="280" height="30" rx="4" fill="#ffa502" opacity="0.2"/>
  <text x="80" y="279" fill="#ffa502" font-family="Arial" font-size="10">Memory leak — 7.8GB heap</text>
  <rect x="70" y="300" width="280" height="30" rx="4" fill="#ffa502" opacity="0.2"/>
  <text x="80" y="319" fill="#ffa502" font-family="Arial" font-size="10">SSL cert expiring in 3 days</text>
  <text x="220" y="370" text-anchor="middle" fill="#ff4757" font-family="Arial" font-size="20" font-weight="bold">Health: 34/100</text>
  <text x="220" y="395" text-anchor="middle" fill="#ff4757" font-family="Arial" font-size="12">Grade F</text>
  <!-- After panel -->
  <rect x="410" y="80" width="340" height="380" rx="8" fill="#0f3460" stroke="#2ed573"/>
  <text x="580" y="105" text-anchor="middle" fill="#2ed573" font-family="Arial" font-size="14" font-weight="bold">AFTER</text>
  <text x="580" y="125" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="10">0 Critical Findings</text>
  <rect x="430" y="140" width="280" height="30" rx="4" fill="#2ed573" opacity="0.2"/>
  <text x="440" y="159" fill="#2ed573" font-family="Arial" font-size="10">SSH Brute Force — IP blocked</text>
  <rect x="430" y="180" width="280" height="30" rx="4" fill="#2ed573" opacity="0.2"/>
  <text x="440" y="199" fill="#2ed573" font-family="Arial" font-size="10">Privilege Escalation — patched</text>
  <rect x="430" y="220" width="280" height="30" rx="4" fill="#2ed573" opacity="0.2"/>
  <text x="440" y="239" fill="#2ed573" font-family="Arial" font-size="10">Disk Space 42% — logs rotated</text>
  <rect x="430" y="260" width="280" height="30" rx="4" fill="#2ed573" opacity="0.2"/>
  <text x="440" y="279" fill="#2ed573" font-family="Arial" font-size="10">Memory — service restarted</text>
  <rect x="430" y="300" width="280" height="30" rx="4" fill="#2ed573" opacity="0.2"/>
  <text x="440" y="319" fill="#2ed573" font-family="Arial" font-size="10">SSL cert — renewed successfully</text>
  <text x="580" y="370" text-anchor="middle" fill="#2ed573" font-family="Arial" font-size="20" font-weight="bold">Health: 96/100</text>
  <text x="580" y="395" text-anchor="middle" fill="#2ed573" font-family="Arial" font-size="12">Grade A</text>
  <!-- Arrow in middle -->
  <text x="395" y="260" text-anchor="middle" fill="#01a982" font-family="Arial" font-size="24">→</text>
</svg>