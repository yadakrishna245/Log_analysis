<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#1a1a2e"/>
  <text x="400" y="40" text-anchor="middle" fill="#01a982" font-family="Arial" font-size="20" font-weight="bold">Network Topology Map</text>
  <rect x="30" y="60" width="740" height="420" rx="8" fill="#16213e" stroke="#01a982" stroke-width="1"/>
  <!-- Internet -->
  <circle cx="400" cy="100" r="20" fill="#0f3460" stroke="#70a1ff" stroke-width="2"/>
  <text x="400" y="104" text-anchor="middle" fill="#70a1ff" font-family="Arial" font-size="8">NET</text>
  <!-- Firewall -->
  <rect x="370" y="145" width="60" height="25" rx="4" fill="#0f3460" stroke="#2ed573" stroke-width="2"/>
  <text x="400" y="162" text-anchor="middle" fill="#2ed573" font-family="Arial" font-size="8">FW</text>
  <!-- Load Balancers -->
  <circle cx="250" cy="220" r="18" fill="#0f3460" stroke="#01a982" stroke-width="2"/>
  <text x="250" y="224" text-anchor="middle" fill="#01a982" font-family="Arial" font-size="7">LB-1</text>
  <circle cx="550" cy="220" r="18" fill="#0f3460" stroke="#01a982" stroke-width="2"/>
  <text x="550" y="224" text-anchor="middle" fill="#01a982" font-family="Arial" font-size="7">LB-2</text>
  <!-- Web servers -->
  <rect x="100" y="280" width="55" height="30" rx="4" fill="#0f3460" stroke="#2ed573" stroke-width="2"/>
  <text x="127" y="299" text-anchor="middle" fill="#2ed573" font-family="Arial" font-size="7">Web-1</text>
  <rect x="180" y="280" width="55" height="30" rx="4" fill="#0f3460" stroke="#2ed573" stroke-width="2"/>
  <text x="207" y="299" text-anchor="middle" fill="#2ed573" font-family="Arial" font-size="7">Web-2</text>
  <rect x="280" y="280" width="55" height="30" rx="4" fill="#0f3460" stroke="#ff4757" stroke-width="2"/>
  <text x="307" y="299" text-anchor="middle" fill="#ff4757" font-family="Arial" font-size="7">Web-3</text>
  <rect x="460" y="280" width="55" height="30" rx="4" fill="#0f3460" stroke="#2ed573" stroke-width="2"/>
  <text x="487" y="299" text-anchor="middle" fill="#2ed573" font-family="Arial" font-size="7">Web-4</text>
  <rect x="540" y="280" width="55" height="30" rx="4" fill="#0f3460" stroke="#ffa502" stroke-width="2"/>
  <text x="567" y="299" text-anchor="middle" fill="#ffa502" font-family="Arial" font-size="7">Web-5</text>
  <rect x="620" y="280" width="55" height="30" rx="4" fill="#0f3460" stroke="#2ed573" stroke-width="2"/>
  <text x="647" y="299" text-anchor="middle" fill="#2ed573" font-family="Arial" font-size="7">Web-6</text>
  <!-- Database -->
  <circle cx="300" cy="380" r="22" fill="#0f3460" stroke="#01a982" stroke-width="2"/>
  <text x="300" y="384" text-anchor="middle" fill="#01a982" font-family="Arial" font-size="7">DB-M</text>
  <circle cx="500" cy="380" r="22" fill="#0f3460" stroke="#2ed573" stroke-width="2"/>
  <text x="500" y="384" text-anchor="middle" fill="#2ed573" font-family="Arial" font-size="7">DB-R1</text>
  <circle cx="620" cy="380" r="22" fill="#0f3460" stroke="#2ed573" stroke-width="2"/>
  <text x="620" y="384" text-anchor="middle" fill="#2ed573" font-family="Arial" font-size="7">DB-R2</text>
  <!-- Connections -->
  <line x1="400" y1="120" x2="400" y2="145" stroke="#70a1ff" stroke-width="1"/>
  <line x1="385" y1="170" x2="260" y2="205" stroke="#01a982" stroke-width="1"/>
  <line x1="415" y1="170" x2="540" y2="205" stroke="#01a982" stroke-width="1"/>
  <line x1="240" y1="237" x2="127" y2="280" stroke="#2ed573" stroke-width="1"/>
  <line x1="245" y1="237" x2="207" y2="280" stroke="#2ed573" stroke-width="1"/>
  <line x1="260" y1="237" x2="307" y2="280" stroke="#ff4757" stroke-width="1" stroke-dasharray="3"/>
  <line x1="540" y1="237" x2="487" y2="280" stroke="#2ed573" stroke-width="1"/>
  <line x1="550" y1="237" x2="567" y2="280" stroke="#ffa502" stroke-width="1"/>
  <line x1="560" y1="237" x2="647" y2="280" stroke="#2ed573" stroke-width="1"/>
  <!-- Alert indicator -->
  <circle cx="320" cy="270" r="6" fill="#ff4757"/>
  <text x="320" y="273" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="6">!</text>
  <!-- Legend -->
  <rect x="50" y="430" width="700" height="35" rx="6" fill="#0f3460"/>
  <circle cx="80" cy="448" r="6" fill="#2ed573"/>
  <text x="95" y="452" fill="#e0e0e0" font-family="Arial" font-size="9">Healthy</text>
  <circle cx="170" cy="448" r="6" fill="#ffa502"/>
  <text x="185" y="452" fill="#e0e0e0" font-family="Arial" font-size="9">Warning</text>
  <circle cx="260" cy="448" r="6" fill="#ff4757"/>
  <text x="275" y="452" fill="#e0e0e0" font-family="Arial" font-size="9">Critical</text>
  <text x="500" y="452" fill="#e0e0e0" font-family="Arial" font-size="9">Nodes: 14 | Healthy: 11 | Warning: 1 | Critical: 1</text>
</svg>