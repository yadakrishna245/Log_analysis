<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#1a1a2e"/>
  <text x="400" y="40" text-anchor="middle" fill="#01a982" font-family="Arial" font-size="20" font-weight="bold">SLA Dashboard</text>
  <rect x="30" y="60" width="740" height="420" rx="8" fill="#16213e" stroke="#01a982" stroke-width="1"/>
  <!-- MTTR Cards -->
  <rect x="50" y="80" width="220" height="90" rx="8" fill="#0f3460"/>
  <text x="160" y="105" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="11">MTTR (Critical)</text>
  <text x="160" y="135" text-anchor="middle" fill="#ff4757" font-family="Arial" font-size="28" font-weight="bold">4.2 min</text>
  <text x="160" y="155" text-anchor="middle" fill="#2ed573" font-family="Arial" font-size="10">-23% vs last month</text>
  <rect x="290" y="80" width="220" height="90" rx="8" fill="#0f3460"/>
  <text x="400" y="105" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="11">MTTR (High)</text>
  <text x="400" y="135" text-anchor="middle" fill="#ffa502" font-family="Arial" font-size="28" font-weight="bold">12.8 min</text>
  <text x="400" y="155" text-anchor="middle" fill="#2ed573" font-family="Arial" font-size="10">-15% vs last month</text>
  <rect x="530" y="80" width="220" height="90" rx="8" fill="#0f3460"/>
  <text x="640" y="105" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="11">MTTR (All)</text>
  <text x="640" y="135" text-anchor="middle" fill="#01a982" font-family="Arial" font-size="28" font-weight="bold">8.4 min</text>
  <text x="640" y="155" text-anchor="middle" fill="#2ed573" font-family="Arial" font-size="10">-18% vs last month</text>
  <!-- SLA Progress bars -->
  <text x="60" y="210" fill="#e0e0e0" font-family="Arial" font-size="12" font-weight="bold">SLA Compliance</text>
  <text x="60" y="240" fill="#e0e0e0" font-family="Arial" font-size="11">P1 Response (&lt;5min)</text>
  <rect x="250" y="228" width="400" height="16" rx="4" fill="#2a2a4a"/>
  <rect x="250" y="228" width="380" height="16" rx="4" fill="#2ed573"/>
  <text x="660" y="240" fill="#2ed573" font-family="Arial" font-size="11" font-weight="bold">96%</text>
  <text x="60" y="275" fill="#e0e0e0" font-family="Arial" font-size="11">P2 Response (&lt;15min)</text>
  <rect x="250" y="263" width="400" height="16" rx="4" fill="#2a2a4a"/>
  <rect x="250" y="263" width="360" height="16" rx="4" fill="#2ed573"/>
  <text x="660" y="275" fill="#2ed573" font-family="Arial" font-size="11" font-weight="bold">91%</text>
  <text x="60" y="310" fill="#e0e0e0" font-family="Arial" font-size="11">P3 Resolution (&lt;4hr)</text>
  <rect x="250" y="298" width="400" height="16" rx="4" fill="#2a2a4a"/>
  <rect x="250" y="298" width="340" height="16" rx="4" fill="#ffa502"/>
  <text x="660" y="310" fill="#ffa502" font-family="Arial" font-size="11" font-weight="bold">85%</text>
  <text x="60" y="345" fill="#e0e0e0" font-family="Arial" font-size="11">Uptime SLA (99.9%)</text>
  <rect x="250" y="333" width="400" height="16" rx="4" fill="#2a2a4a"/>
  <rect x="250" y="333" width="396" height="16" rx="4" fill="#2ed573"/>
  <text x="660" y="345" fill="#2ed573" font-family="Arial" font-size="11" font-weight="bold">99.92%</text>
  <!-- Monthly trend -->
  <rect x="50" y="370" width="700" height="90" rx="8" fill="#0f3460"/>
  <text x="70" y="395" fill="#e0e0e0" font-family="Arial" font-size="11" font-weight="bold">Monthly MTTR Trend</text>
  <line x1="80" y1="440" x2="730" y2="440" stroke="#2a2a4a" stroke-width="1"/>
  <circle cx="130" cy="420" r="4" fill="#01a982"/>
  <circle cx="230" cy="425" r="4" fill="#01a982"/>
  <circle cx="330" cy="415" r="4" fill="#01a982"/>
  <circle cx="430" cy="430" r="4" fill="#01a982"/>
  <circle cx="530" cy="410" r="4" fill="#01a982"/>
  <circle cx="630" cy="420" r="4" fill="#01a982"/>
  <line x1="130" y1="420" x2="230" y2="425" stroke="#01a982" stroke-width="2"/>
  <line x1="230" y1="425" x2="330" y2="415" stroke="#01a982" stroke-width="2"/>
  <line x1="330" y1="415" x2="430" y2="430" stroke="#01a982" stroke-width="2"/>
  <line x1="430" y1="430" x2="530" y2="410" stroke="#01a982" stroke-width="2"/>
  <line x1="530" y1="410" x2="630" y2="420" stroke="#01a982" stroke-width="2"/>
</svg>