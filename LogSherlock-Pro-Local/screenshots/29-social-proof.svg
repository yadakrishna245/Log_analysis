  <text x="70" y="256" fill="#e0e0e0" font-family="Arial" font-size="10" font-style="italic">analysis is genuinely magical."</text>
  <text x="70" y="278" fill="#ffa502" font-family="Arial" font-size="10">★★★★★</text>
  <rect x="410" y="150" width="340" height="140" rx="8" fill="#0f3460" stroke="#01a982" stroke-width="0.5"/>
  <circle cx="440" cy="180" r="15" fill="#70a1ff" opacity="0.3"/>
  <text x="440" y="184" text-anchor="middle" fill="#70a1ff" font-family="Arial" font-size="10">JD</text>
  <text x="465" y="175" fill="#e0e0e0" font-family="Arial" font-size="11" font-weight="bold">James Davis</text>
  <text x="465" y="192" fill="#e0e0e0" font-family="Arial" font-size="9">DevOps Lead, StartupXYZ</text>
  <text x="430" y="220" fill="#e0e0e0" font-family="Arial" font-size="10" font-style="italic">"Best investment we made this year.</text>
  <text x="430" y="238" fill="#e0e0e0" font-family="Arial" font-size="10" font-style="italic">The predictive warnings alone saved</text>
  <text x="430" y="256" fill="#e0e0e0" font-family="Arial" font-size="10" font-style="italic">us from 3 potential outages."</text>
  <text x="430" y="278" fill="#ffa502" font-family="Arial" font-size="10">★★★★★</text>
  <!-- Third testimonial -->
  <rect x="50" y="310" width="700" height="100" rx="8" fill="#0f3460" stroke="#01a982" stroke-width="0.5"/>
  <circle cx="80" cy="340" r="15" fill="#2ed573" opacity="0.3"/>
  <text x="80" y="344" text-anchor="middle" fill="#2ed573" font-family="Arial" font-size="10">MR</text>
  <text x="105" y="335" fill="#e0e0e0" font-family="Arial" font-size="11" font-weight="bold">Maria Rodriguez</text>
  <text x="105" y="352" fill="#e0e0e0" font-family="Arial" font-size="9">VP Engineering, EnterpriseCloud</text>
  <text x="70" y="378" fill="#e0e0e0" font-family="Arial" font-size="10" font-style="italic">"Rolled out to 50 engineers in a day. Zero training needed — the guided mode got everyone productive instantly."</text>
  <text x="70" y="398" fill="#ffa502" font-family="Arial" font-size="10">★★★★☆</text>
  <!-- Carousel dots -->
  <circle cx="370" cy="440" r="5" fill="#01a982"/>
  <circle cx="390" cy="440" r="5" fill="#2a2a4a"/>
  <circle cx="410" cy="440" r="5" fill="#2a2a4a"/>
  <text x="370" y="465" fill="#e0e0e0" font-family="Arial" font-size="9">Page 1 of 3</text>
