  <rect x="590" y="80" width="160" height="50" rx="8" fill="#0f3460"/>
  <text x="670" y="100" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="10">NPS Score</text>
  <text x="670" y="120" text-anchor="middle" fill="#2ed573" font-family="Arial" font-size="16" font-weight="bold">72</text>
  <!-- Testimonial cards -->
  <rect x="50" y="150" width="340" height="140" rx="8" fill="#0f3460" stroke="#01a982" stroke-width="0.5"/>
