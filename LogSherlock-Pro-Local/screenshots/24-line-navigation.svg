<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#1a1a2e"/>
  <text x="400" y="40" text-anchor="middle" fill="#01a982" font-family="Arial" font-size="20" font-weight="bold">Line Navigation</text>
  <rect x="30" y="60" width="740" height="420" rx="8" fill="#16213e" stroke="#01a982" stroke-width="1"/>
  <!-- Code editor mockup -->
  <rect x="50" y="80" width="700" height="260" rx="8" fill="#0d1117"/>
  <!-- Line numbers and content -->
  <text x="70" y="105" fill="#555" font-family="monospace" font-size="10">142</text>
  <text x="110" y="105" fill="#e0e0e0" font-family="monospace" font-size="10">  server.listen(port, () =&gt; {</text>
  <text x="70" y="122" fill="#555" font-family="monospace" font-size="10">143</text>
  <text x="110" y="122" fill="#e0e0e0" font-family="monospace" font-size="10">    console.log(`Server on ${port}`);</text>
  <text x="70" y="139" fill="#555" font-family="monospace" font-size="10">144</text>
  <text x="110" y="139" fill="#e0e0e0" font-family="monospace" font-size="10">  });</text>
  <!-- Highlighted error line -->
  <rect x="50" y="145" width="700" height="18" fill="#ff4757" opacity="0.15"/>
  <text x="70" y="158" fill="#ff4757" font-family="monospace" font-size="10">145</text>
  <text x="110" y="158" fill="#ff4757" font-family="monospace" font-size="10">  session.heap = allocateBuffer(MAX);</text>
  <!-- Badge on line -->
  <rect x="620" y="146" width="80" height="16" rx="8" fill="#ff4757"/>
  <text x="660" y="157" text-anchor="middle" fill="#e0e0e0" font-family="monospace" font-size="8">CRITICAL</text>
  <text x="70" y="175" fill="#555" font-family="monospace" font-size="10">146</text>
  <text x="110" y="175" fill="#e0e0e0" font-family="monospace" font-size="10">  if (!session.valid) {</text>
  <text x="70" y="192" fill="#555" font-family="monospace" font-size="10">147</text>
  <text x="110" y="192" fill="#e0e0e0" font-family="monospace" font-size="10">    throw new Error('Invalid');</text>
  <text x="70" y="209" fill="#555" font-family="monospace" font-size="10">148</text>
  <text x="110" y="209" fill="#e0e0e0" font-family="monospace" font-size="10">  }</text>
  <!-- Highlighted warning line -->
  <rect x="50" y="215" width="700" height="18" fill="#ffa502" opacity="0.1"/>
  <text x="70" y="228" fill="#ffa502" font-family="monospace" font-size="10">149</text>
  <text x="110" y="228" fill="#ffa502" font-family="monospace" font-size="10">  db.query(userInput); // unsanitized</text>
  <rect x="620" y="216" width="60" height="16" rx="8" fill="#ffa502"/>
  <text x="650" y="227" text-anchor="middle" fill="#1a1a2e" font-family="monospace" font-size="8">HIGH</text>
  <text x="70" y="245" fill="#555" font-family="monospace" font-size="10">150</text>
  <text x="110" y="245" fill="#e0e0e0" font-family="monospace" font-size="10">  return response.json(data);</text>
  <!-- Popup tooltip -->
  <rect x="350" y="260" width="380" height="90" rx="8" fill="#0f3460" stroke="#ff4757"/>
  <text x="370" y="282" fill="#ff4757" font-family="Arial" font-size="11" font-weight="bold">Memory Leak: Unbounded Allocation</text>
  <text x="370" y="300" fill="#e0e0e0" font-family="Arial" font-size="9">Line 145: allocateBuffer(MAX) without cleanup</text>
  <text x="370" y="318" fill="#e0e0e0" font-family="Arial" font-size="9">causes heap growth from 2GB to 7.8GB over 4hrs</text>
  <rect x="370" y="325" width="80" height="20" rx="4" fill="#01a982"/>
  <text x="410" y="339" text-anchor="middle" fill="#1a1a2e" font-family="Arial" font-size="9">Fix it</text>
  <rect x="460" y="325" width="80" height="20" rx="4" fill="#0f3460" stroke="#01a982"/>
  <text x="500" y="339" text-anchor="middle" fill="#01a982" font-family="Arial" font-size="9">Details</text>
  <!-- File path -->
  <rect x="50" y="370" width="700" height="30" rx="6" fill="#0f3460"/>
  <text x="70" y="390" fill="#e0e0e0" font-family="Arial" font-size="10">src/server/session-manager.js — Correlated with OOM at 03:01 UTC</text>
  <!-- Navigate buttons -->
  <rect x="50" y="420" width="150" height="35" rx="8" fill="#0f3460" stroke="#01a982"/>
  <text x="125" y="442" text-anchor="middle" fill="#01a982" font-family="Arial" font-size="10">Previous Finding</text>
  <rect x="220" y="420" width="150" height="35" rx="8" fill="#0f3460" stroke="#01a982"/>
  <text x="295" y="442" text-anchor="middle" fill="#01a982" font-family="Arial" font-size="10">Next Finding</text>
  <text x="550" y="442" fill="#e0e0e0" font-family="Arial" font-size="10">Finding 3 of 23</text>
</svg>