<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#1a1a2e"/>
  <text x="400" y="40" text-anchor="middle" fill="#01a982" font-family="Arial" font-size="20" font-weight="bold">Multi-Log Correlation</text>
  <rect x="30" y="60" width="740" height="420" rx="8" fill="#16213e" stroke="#01a982" stroke-width="1"/>
  <!-- Swim lanes -->
  <text x="50" y="100" fill="#ff4757" font-family="Arial" font-size="11" font-weight="bold">auth.log</text>
  <line x1="130" y1="95" x2="740" y2="95" stroke="#2a2a4a" stroke-width="1"/>
  <text x="50" y="170" fill="#ffa502" font-family="Arial" font-size="11" font-weight="bold">syslog</text>
  <line x1="130" y1="165" x2="740" y2="165" stroke="#2a2a4a" stroke-width="1"/>
  <text x="50" y="240" fill="#70a1ff" font-family="Arial" font-size="11" font-weight="bold">nginx</text>
  <line x1="130" y1="235" x2="740" y2="235" stroke="#2a2a4a" stroke-width="1"/>
  <text x="50" y="310" fill="#2ed573" font-family="Arial" font-size="11" font-weight="bold">app.log</text>
  <line x1="130" y1="305" x2="740" y2="305" stroke="#2a2a4a" stroke-width="1"/>
  <!-- Events on auth lane -->
  <rect x="180" y="82" width="60" height="20" rx="4" fill="#ff4757"/>
  <text x="210" y="96" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="7">SSH Fail</text>
  <rect x="280" y="82" width="60" height="20" rx="4" fill="#ff4757"/>
  <text x="310" y="96" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="7">SSH Fail</text>
  <rect x="400" y="82" width="70" height="20" rx="4" fill="#ff4757"/>
  <text x="435" y="96" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="7">Root Login</text>
  <!-- Events on syslog lane -->
  <rect x="350" y="152" width="70" height="20" rx="4" fill="#ffa502"/>
  <text x="385" y="166" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="7">CPU Spike</text>
  <rect x="500" y="152" width="80" height="20" rx="4" fill="#ffa502"/>
  <text x="540" y="166" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="7">OOM Kill</text>
  <!-- Events on nginx lane -->
  <rect x="200" y="222" width="60" height="20" rx="4" fill="#70a1ff"/>
  <text x="230" y="236" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="7">4xx Spike</text>
  <rect x="450" y="222" width="80" height="20" rx="4" fill="#70a1ff"/>
  <text x="490" y="236" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="7">502 Errors</text>
  <!-- Events on app lane -->
  <rect x="420" y="292" width="90" height="20" rx="4" fill="#2ed573"/>
  <text x="465" y="306" text-anchor="middle" fill="#1a1a2e" font-family="Arial" font-size="7">DB Timeout</text>
  <rect x="560" y="292" width="80" height="20" rx="4" fill="#2ed573"/>
  <text x="600" y="306" text-anchor="middle" fill="#1a1a2e" font-family="Arial" font-size="7">App Crash</text>
  <!-- Correlation arrows -->
  <line x1="310" y1="102" x2="385" y2="152" stroke="#01a982" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="435" y1="102" x2="465" y2="292" stroke="#01a982" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="540" y1="172" x2="560" y2="292" stroke="#01a982" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="490" y1="242" x2="560" y2="292" stroke="#01a982" stroke-width="1.5" stroke-dasharray="4"/>
  <!-- Timeline axis -->
  <line x1="130" y1="350" x2="740" y2="350" stroke="#e0e0e0" stroke-width="1"/>
  <text x="180" y="370" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="9">03:40</text>
  <text x="310" y="370" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="9">03:41</text>
  <text x="440" y="370" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="9">03:42</text>
  <text x="570" y="370" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="9">03:43</text>
  <text x="700" y="370" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="9">03:44</text>
  <!-- Summary -->
  <rect x="50" y="390" width="700" height="70" rx="8" fill="#0f3460"/>
  <text x="70" y="415" fill="#01a982" font-family="Arial" font-size="11" font-weight="bold">Correlation Summary</text>
  <text x="70" y="435" fill="#e0e0e0" font-family="Arial" font-size="10">4 log sources | 8 correlated events | 5 causal links identified</text>
  <text x="70" y="450" fill="#e0e0e0" font-family="Arial" font-size="10">Root trigger: SSH brute force at 03:40 UTC led to cascade failure</text>
</svg>