<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#1a1a2e"/>
  <text x="400" y="40" text-anchor="middle" fill="#01a982" font-family="Arial" font-size="20" font-weight="bold">Knowledge Base</text>
  <rect x="30" y="60" width="740" height="420" rx="8" fill="#16213e" stroke="#01a982" stroke-width="1"/>
  <!-- Article header -->
  <rect x="50" y="80" width="700" height="50" rx="8" fill="#0f3460"/>
  <text x="70" y="105" fill="#01a982" font-family="Arial" font-size="14" font-weight="bold">KB-0042: SSH Brute Force Attack Remediation</text>
  <text x="70" y="122" fill="#e0e0e0" font-family="Arial" font-size="9">Category: Security | Severity: Critical | Last updated: Jan 2024</text>
  <!-- Solution steps -->
  <text x="60" y="160" fill="#e0e0e0" font-family="Arial" font-size="12" font-weight="bold">Solution Steps:</text>
  <rect x="60" y="170" width="680" height="35" rx="6" fill="#0f3460"/>
  <circle cx="85" cy="188" r="10" fill="#01a982"/>
  <text x="85" y="192" text-anchor="middle" fill="#1a1a2e" font-family="Arial" font-size="9" font-weight="bold">1</text>
  <text x="105" y="192" fill="#e0e0e0" font-family="Arial" font-size="10">Block the attacking IP immediately using iptables or firewall rules</text>
  <rect x="60" y="212" width="680" height="35" rx="6" fill="#0f3460"/>
  <circle cx="85" cy="230" r="10" fill="#01a982"/>
  <text x="85" y="234" text-anchor="middle" fill="#1a1a2e" font-family="Arial" font-size="9" font-weight="bold">2</text>
  <text x="105" y="234" fill="#e0e0e0" font-family="Arial" font-size="10">Check if any accounts were compromised (review auth.log for successful logins)</text>
  <rect x="60" y="254" width="680" height="35" rx="6" fill="#0f3460"/>
  <circle cx="85" cy="272" r="10" fill="#01a982"/>
  <text x="85" y="276" text-anchor="middle" fill="#1a1a2e" font-family="Arial" font-size="9" font-weight="bold">3</text>
  <text x="105" y="276" fill="#e0e0e0" font-family="Arial" font-size="10">Reset passwords for targeted accounts and enable MFA</text>
  <rect x="60" y="296" width="680" height="35" rx="6" fill="#0f3460"/>
  <circle cx="85" cy="314" r="10" fill="#01a982"/>
  <text x="85" y="318" text-anchor="middle" fill="#1a1a2e" font-family="Arial" font-size="9" font-weight="bold">4</text>
  <text x="105" y="318" fill="#e0e0e0" font-family="Arial" font-size="10">Install and configure fail2ban to prevent future attacks</text>
  <rect x="60" y="338" width="680" height="35" rx="6" fill="#0f3460"/>
  <circle cx="85" cy="356" r="10" fill="#01a982"/>
  <text x="85" y="360" text-anchor="middle" fill="#1a1a2e" font-family="Arial" font-size="9" font-weight="bold">5</text>
  <text x="105" y="360" fill="#e0e0e0" font-family="Arial" font-size="10">Consider switching to key-based authentication only</text>
  <!-- Related articles -->
  <rect x="50" y="390" width="700" height="70" rx="8" fill="#0f3460"/>
  <text x="70" y="415" fill="#e0e0e0" font-family="Arial" font-size="11" font-weight="bold">Related Articles:</text>
  <text x="70" y="435" fill="#70a1ff" font-family="Arial" font-size="10">KB-0038: Setting up fail2ban</text>
  <text x="350" y="435" fill="#70a1ff" font-family="Arial" font-size="10">KB-0041: SSH key authentication guide</text>
  <text x="70" y="452" fill="#70a1ff" font-family="Arial" font-size="10">KB-0015: Firewall best practices</text>
</svg>