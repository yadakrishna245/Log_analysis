<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#1a1a2e"/>
  <text x="400" y="40" text-anchor="middle" fill="#01a982" font-family="Arial" font-size="20" font-weight="bold">Cascade Failure Chain</text>
  <rect x="30" y="60" width="740" height="420" rx="8" fill="#16213e" stroke="#01a982" stroke-width="1"/>
  <!-- Domino boxes -->
  <rect x="50" y="180" width="120" height="60" rx="8" fill="#ff4757" opacity="0.2" stroke="#ff4757"/>
  <text x="110" y="205" text-anchor="middle" fill="#ff4757" font-family="Arial" font-size="10" font-weight="bold">DNS Failure</text>
  <text x="110" y="225" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="9">03:41:02 UTC</text>
  <rect x="210" y="180" width="120" height="60" rx="8" fill="#ff4757" opacity="0.2" stroke="#ffa502"/>
  <text x="270" y="205" text-anchor="middle" fill="#ffa502" font-family="Arial" font-size="10" font-weight="bold">API Timeout</text>
  <text x="270" y="225" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="9">03:41:15 UTC</text>
  <rect x="370" y="180" width="120" height="60" rx="8" fill="#ffa502" opacity="0.2" stroke="#ffa502"/>
  <text x="430" y="205" text-anchor="middle" fill="#ffa502" font-family="Arial" font-size="10" font-weight="bold">Queue Backup</text>
  <text x="430" y="225" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="9">03:41:47 UTC</text>
  <rect x="530" y="180" width="120" height="60" rx="8" fill="#ff4757" opacity="0.2" stroke="#ff4757"/>
  <text x="590" y="205" text-anchor="middle" fill="#ff4757" font-family="Arial" font-size="10" font-weight="bold">DB Connection</text>
  <text x="590" y="220" text-anchor="middle" fill="#ff4757" font-family="Arial" font-size="9">Pool Exhausted</text>
  <text x="590" y="235" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="9">03:42:31 UTC</text>
  <rect x="640" y="280" width="120" height="60" rx="8" fill="#ff4757" stroke="#ff4757"/>
  <text x="700" y="305" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="10" font-weight="bold">FULL OUTAGE</text>
  <text x="700" y="325" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="9">03:43:02 UTC</text>
  <!-- Arrows -->
  <line x1="170" y1="210" x2="210" y2="210" stroke="#01a982" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="210" x2="370" y2="210" stroke="#01a982" stroke-width="2"/>
  <line x1="490" y1="210" x2="530" y2="210" stroke="#01a982" stroke-width="2"/>
  <line x1="620" y1="240" x2="680" y2="280" stroke="#ff4757" stroke-width="2"/>
  <!-- Impact area -->
  <rect x="50" y="360" width="700" height="100" rx="8" fill="#0f3460"/>
  <text x="70" y="385" fill="#e0e0e0" font-family="Arial" font-size="12" font-weight="bold">Impact Summary</text>
  <text x="70" y="410" fill="#e0e0e0" font-family="Arial" font-size="11">Root Cause: DNS resolver 10.0.0.2 became unresponsive</text>
  <text x="70" y="430" fill="#e0e0e0" font-family="Arial" font-size="11">Cascade Time: 2 minutes from trigger to full outage</text>
  <text x="70" y="450" fill="#ff4757" font-family="Arial" font-size="11">Affected Services: 14 | Users Impacted: ~2,400</text>
  <!-- Timeline bar -->
  <rect x="50" y="100" width="700" height="4" rx="2" fill="#2a2a4a"/>
  <rect x="50" y="100" width="700" height="4" rx="2" fill="#ff4757" opacity="0.5"/>
  <circle cx="110" cy="102" r="6" fill="#ff4757"/>
  <circle cx="270" cy="102" r="6" fill="#ffa502"/>
  <circle cx="430" cy="102" r="6" fill="#ffa502"/>
  <circle cx="590" cy="102" r="6" fill="#ff4757"/>
  <circle cx="700" cy="102" r="6" fill="#ff4757"/>
</svg>