<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#1a1a2e"/>
  <text x="400" y="40" text-anchor="middle" fill="#01a982" font-family="Arial" font-size="20" font-weight="bold">ROI Calculator</text>
  <rect x="30" y="60" width="740" height="420" rx="8" fill="#16213e" stroke="#01a982" stroke-width="1"/>
  <!-- Big metrics -->
  <rect x="50" y="80" width="220" height="120" rx="8" fill="#0f3460" stroke="#01a982"/>
  <text x="160" y="110" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="12">Hours Saved / Month</text>
  <text x="160" y="155" text-anchor="middle" fill="#01a982" font-family="Arial" font-size="36" font-weight="bold">142</text>
  <text x="160" y="180" text-anchor="middle" fill="#2ed573" font-family="Arial" font-size="11">vs manual analysis</text>
  <rect x="290" y="80" width="220" height="120" rx="8" fill="#0f3460" stroke="#01a982"/>
  <text x="400" y="110" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="12">Money Saved / Month</text>
  <text x="400" y="155" text-anchor="middle" fill="#01a982" font-family="Arial" font-size="36" font-weight="bold">$18.4K</text>
  <text x="400" y="180" text-anchor="middle" fill="#2ed573" font-family="Arial" font-size="11">based on $130/hr eng cost</text>
  <rect x="530" y="80" width="220" height="120" rx="8" fill="#0f3460" stroke="#01a982"/>
  <text x="640" y="110" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="12">ROI</text>
  <text x="640" y="155" text-anchor="middle" fill="#2ed573" font-family="Arial" font-size="36" font-weight="bold">847%</text>
  <text x="640" y="180" text-anchor="middle" fill="#2ed573" font-family="Arial" font-size="11">annual return</text>
  <!-- Breakdown -->
  <rect x="50" y="220" width="700" height="140" rx="8" fill="#0f3460"/>
  <text x="70" y="250" fill="#e0e0e0" font-family="Arial" font-size="12" font-weight="bold">Savings Breakdown</text>
  <text x="70" y="275" fill="#e0e0e0" font-family="Arial" font-size="10">Faster incident detection:</text>
  <rect x="280" y="265" width="350" height="12" rx="3" fill="#2a2a4a"/>
  <rect x="280" y="265" width="280" height="12" rx="3" fill="#01a982"/>
  <text x="640" y="275" fill="#01a982" font-family="Arial" font-size="10">68 hrs</text>
  <text x="70" y="300" fill="#e0e0e0" font-family="Arial" font-size="10">Automated root cause analysis:</text>
  <rect x="280" y="290" width="350" height="12" rx="3" fill="#2a2a4a"/>
  <rect x="280" y="290" width="200" height="12" rx="3" fill="#01a982"/>
  <text x="640" y="300" fill="#01a982" font-family="Arial" font-size="10">42 hrs</text>
  <text x="70" y="325" fill="#e0e0e0" font-family="Arial" font-size="10">Reduced escalations:</text>
  <rect x="280" y="315" width="350" height="12" rx="3" fill="#2a2a4a"/>
  <rect x="280" y="315" width="130" height="12" rx="3" fill="#01a982"/>
  <text x="640" y="325" fill="#01a982" font-family="Arial" font-size="10">32 hrs</text>
  <!-- Comparison -->
  <rect x="50" y="375" width="340" height="85" rx="8" fill="#ff4757" opacity="0.1" stroke="#ff4757"/>
  <text x="220" y="400" text-anchor="middle" fill="#ff4757" font-family="Arial" font-size="12" font-weight="bold">Without LogSherlock</text>
  <text x="220" y="420" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="10">Avg MTTR: 45 min | Manual triage</text>
  <text x="220" y="440" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="10">Cost: $22,100/month in eng time</text>
  <rect x="410" y="375" width="340" height="85" rx="8" fill="#2ed573" opacity="0.1" stroke="#2ed573"/>
  <text x="580" y="400" text-anchor="middle" fill="#2ed573" font-family="Arial" font-size="12" font-weight="bold">With LogSherlock</text>
  <text x="580" y="420" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="10">Avg MTTR: 4.2 min | AI-assisted</text>
  <text x="580" y="440" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="10">Cost: $3,700/month in eng time</text>
</svg>