<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#1a1a2e"/>
  <text x="400" y="40" text-anchor="middle" fill="#01a982" font-family="Arial" font-size="20" font-weight="bold">Customer Email Generator</text>
  <rect x="30" y="60" width="740" height="420" rx="8" fill="#16213e" stroke="#01a982" stroke-width="1"/>
  <!-- Tone selector -->
  <text x="60" y="90" fill="#e0e0e0" font-family="Arial" font-size="12" font-weight="bold">Tone:</text>
  <rect x="110" y="75" width="90" height="25" rx="12" fill="#01a982"/>
  <text x="155" y="92" text-anchor="middle" fill="#1a1a2e" font-family="Arial" font-size="10" font-weight="bold">Professional</text>
  <rect x="210" y="75" width="80" height="25" rx="12" fill="#0f3460" stroke="#2a2a4a"/>
  <text x="250" y="92" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="10">Empathetic</text>
  <rect x="300" y="75" width="70" height="25" rx="12" fill="#0f3460" stroke="#2a2a4a"/>
  <text x="335" y="92" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="10">Urgent</text>
  <rect x="380" y="75" width="70" height="25" rx="12" fill="#0f3460" stroke="#2a2a4a"/>
  <text x="415" y="92" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="10">Casual</text>
  <!-- Email preview -->
  <rect x="50" y="115" width="700" height="290" rx="8" fill="#0f3460"/>
  <rect x="50" y="115" width="700" height="35" rx="8" fill="#01a982" opacity="0.1"/>
  <text x="70" y="137" fill="#e0e0e0" font-family="Arial" font-size="10">To: customer-ops@acmecorp.com</text>
  <text x="500" y="137" fill="#e0e0e0" font-family="Arial" font-size="10">Subject: Incident Resolution - Ticket #4521</text>
  <line x1="50" y1="150" x2="750" y2="150" stroke="#2a2a4a"/>
  <text x="70" y="175" fill="#e0e0e0" font-family="Arial" font-size="11">Dear ACME Operations Team,</text>
  <text x="70" y="200" fill="#e0e0e0" font-family="Arial" font-size="10">We have identified and resolved the root cause of the CPU spike</text>
  <text x="70" y="218" fill="#e0e0e0" font-family="Arial" font-size="10">incident affecting your production environment (prod-web-03).</text>
  <text x="70" y="245" fill="#e0e0e0" font-family="Arial" font-size="10" font-weight="bold">Root Cause:</text>
  <text x="70" y="263" fill="#e0e0e0" font-family="Arial" font-size="10">Memory leak in the SessionManager module introduced in v2.4.1</text>
  <text x="70" y="290" fill="#e0e0e0" font-family="Arial" font-size="10" font-weight="bold">Resolution:</text>
  <text x="70" y="308" fill="#e0e0e0" font-family="Arial" font-size="10">Deployed hotfix v2.4.2, heap stabilized at 2.1GB (normal range).</text>
  <text x="70" y="335" fill="#e0e0e0" font-family="Arial" font-size="10">Detection to resolution: 4.2 minutes (SLA target: 5 min)</text>
  <text x="70" y="365" fill="#e0e0e0" font-family="Arial" font-size="10">Best regards,</text>
  <text x="70" y="383" fill="#01a982" font-family="Arial" font-size="10">LogSherlock Ops Team</text>
  <!-- Action buttons -->
  <rect x="50" y="420" width="120" height="35" rx="8" fill="#01a982"/>
  <text x="110" y="442" text-anchor="middle" fill="#1a1a2e" font-family="Arial" font-size="11" font-weight="bold">Send Email</text>
  <rect x="185" y="420" width="100" height="35" rx="8" fill="#0f3460" stroke="#01a982"/>
  <text x="235" y="442" text-anchor="middle" fill="#01a982" font-family="Arial" font-size="11">Copy</text>
  <rect x="300" y="420" width="120" height="35" rx="8" fill="#0f3460" stroke="#2a2a4a"/>
  <text x="360" y="442" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="11">Regenerate</text>
</svg>