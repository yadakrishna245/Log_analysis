<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#1a1a2e"/>
  <text x="400" y="40" text-anchor="middle" fill="#01a982" font-family="Arial" font-size="20" font-weight="bold">Guided Mode — Step 4 of 7</text>
  <rect x="30" y="60" width="740" height="420" rx="8" fill="#16213e" stroke="#01a982" stroke-width="1"/>
  <!-- Progress steps -->
  <circle cx="120" cy="90" r="12" fill="#01a982"/>
  <text x="120" y="94" text-anchor="middle" fill="#1a1a2e" font-family="Arial" font-size="10">1</text>
  <line x1="132" y1="90" x2="188" y2="90" stroke="#01a982" stroke-width="2"/>
  <circle cx="200" cy="90" r="12" fill="#01a982"/>
