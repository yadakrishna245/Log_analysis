<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#1a1a2e"/>
  <text x="400" y="40" text-anchor="middle" fill="#01a982" font-family="Arial" font-size="20" font-weight="bold">What's New</text>
  <rect x="100" y="60" width="600" height="420" rx="8" fill="#16213e" stroke="#01a982" stroke-width="1"/>
  <!-- Version header -->
  <rect x="120" y="80" width="560" height="35" rx="6" fill="#01a982" opacity="0.15"/>
  <text x="140" y="102" fill="#01a982" font-family="Arial" font-size="14" font-weight="bold">v2.4.0 — January 15, 2024</text>
  <text x="580" y="102" fill="#e0e0e0" font-family="Arial" font-size="10">Latest</text>
  <!-- New features -->
  <text x="140" y="135" fill="#2ed573" font-family="Arial" font-size="11" font-weight="bold">New Features</text>
  <text x="155" y="155" fill="#e0e0e0" font-family="Arial" font-size="10">• Predictive Warnings — AI forecasts issues before they happen</text>
  <text x="155" y="175" fill="#e0e0e0" font-family="Arial" font-size="10">• Cascade Chain Analysis — visualize failure domino effects</text>
  <text x="155" y="195" fill="#e0e0e0" font-family="Arial" font-size="10">• Training Mode — gamified learning for your ops team</text>
  <!-- Improvements -->
  <text x="140" y="225" fill="#70a1ff" font-family="Arial" font-size="11" font-weight="bold">Improvements</text>
  <text x="155" y="245" fill="#e0e0e0" font-family="Arial" font-size="10">• 3x faster scan performance for large log files</text>
  <text x="155" y="265" fill="#e0e0e0" font-family="Arial" font-size="10">• Improved AI accuracy (94% confidence on root cause)</text>
  <text x="155" y="285" fill="#e0e0e0" font-family="Arial" font-size="10">• Dark theme refinements and accessibility fixes</text>
  <!-- Bug fixes -->
  <text x="140" y="315" fill="#ffa502" font-family="Arial" font-size="11" font-weight="bold">Bug Fixes</text>
  <text x="155" y="335" fill="#e0e0e0" font-family="Arial" font-size="10">• Fixed PDF export truncation on large reports</text>
  <text x="155" y="355" fill="#e0e0e0" font-family="Arial" font-size="10">• Resolved Jira sync timeout on slow connections</text>
  <!-- Previous version -->
  <line x1="130" y1="375" x2="670" y2="375" stroke="#2a2a4a"/>
  <text x="140" y="400" fill="#e0e0e0" font-family="Arial" font-size="12" font-weight="bold">v2.3.2 — December 28, 2023</text>
  <text x="155" y="420" fill="#e0e0e0" font-family="Arial" font-size="10">• Hotfix: Memory leak in long-running scans</text>
  <text x="155" y="440" fill="#e0e0e0" font-family="Arial" font-size="10">• Improved multi-log correlation accuracy</text>
  <!-- Close button -->
  <circle cx="680" cy="75" r="12" fill="#0f3460" stroke="#2a2a4a"/>
  <text x="680" y="79" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="12">×</text>
</svg>