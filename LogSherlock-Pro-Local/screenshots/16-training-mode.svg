<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#1a1a2e"/>
  <text x="400" y="40" text-anchor="middle" fill="#01a982" font-family="Arial" font-size="20" font-weight="bold">Training Mode — Challenge</text>
  <rect x="30" y="60" width="740" height="420" rx="8" fill="#16213e" stroke="#01a982" stroke-width="1"/>
  <!-- Timer and Score -->
  <rect x="50" y="80" width="150" height="50" rx="8" fill="#0f3460"/>
  <text x="125" y="100" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="10">Time Remaining</text>
  <text x="125" y="120" text-anchor="middle" fill="#ffa502" font-family="Arial" font-size="18" font-weight="bold">04:32</text>
  <rect x="220" y="80" width="150" height="50" rx="8" fill="#0f3460"/>
  <text x="295" y="100" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="10">Score</text>
  <text x="295" y="120" text-anchor="middle" fill="#01a982" font-family="Arial" font-size="18" font-weight="bold">750 pts</text>
  <rect x="390" y="80" width="150" height="50" rx="8" fill="#0f3460"/>
  <text x="465" y="100" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="10">Streak</text>
  <text x="465" y="120" text-anchor="middle" fill="#2ed573" font-family="Arial" font-size="18" font-weight="bold">5x</text>
  <rect x="560" y="80" width="150" height="50" rx="8" fill="#0f3460"/>
  <text x="635" y="100" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="10">Level</text>
  <text x="635" y="120" text-anchor="middle" fill="#70a1ff" font-family="Arial" font-size="18" font-weight="bold">Advanced</text>
  <!-- Challenge card -->
  <rect x="50" y="150" width="700" height="200" rx="8" fill="#0f3460" stroke="#01a982"/>
  <text x="70" y="180" fill="#01a982" font-family="Arial" font-size="13" font-weight="bold">Challenge #12: Identify the Attack Vector</text>
  <text x="70" y="210" fill="#e0e0e0" font-family="Arial" font-size="11">Given the following log entries, identify the type of attack:</text>
  <rect x="70" y="220" width="660" height="60" rx="4" fill="#1a1a2e"/>
  <text x="80" y="240" fill="#ff4757" font-family="Arial" font-size="9">Jan 15 03:41:02 prod-web sshd[2847]: Failed password for root from 192.168.1.105</text>
  <text x="80" y="255" fill="#ff4757" font-family="Arial" font-size="9">Jan 15 03:41:03 prod-web sshd[2848]: Failed password for admin from 192.168.1.105</text>
  <text x="80" y="270" fill="#ff4757" font-family="Arial" font-size="9">Jan 15 03:41:04 prod-web sshd[2849]: Failed password for user from 192.168.1.105</text>
  <!-- Answer choices -->
  <rect x="70" y="295" width="300" height="35" rx="6" fill="#01a982" opacity="0.2" stroke="#01a982"/>
  <text x="220" y="316" text-anchor="middle" fill="#01a982" font-family="Arial" font-size="11">A) Brute Force Attack</text>
  <rect x="390" y="295" width="300" height="35" rx="6" fill="#0f3460" stroke="#2a2a4a"/>
  <text x="540" y="316" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="11">B) SQL Injection</text>
  <!-- Progress -->
  <rect x="50" y="370" width="700" height="40" rx="8" fill="#0f3460"/>
  <text x="70" y="395" fill="#e0e0e0" font-family="Arial" font-size="10">Progress: 12/20 challenges completed</text>
  <rect x="280" y="385" width="400" height="10" rx="4" fill="#2a2a4a"/>
  <rect x="280" y="385" width="240" height="10" rx="4" fill="#01a982"/>
  <!-- Badges -->
  <rect x="50" y="420" width="700" height="45" rx="8" fill="#0f3460"/>
  <text x="70" y="445" fill="#e0e0e0" font-family="Arial" font-size="10">Badges:</text>
  <circle cx="140" cy="442" r="12" fill="#ffa502" opacity="0.3" stroke="#ffa502"/>
  <text x="140" y="446" text-anchor="middle" fill="#ffa502" font-family="Arial" font-size="8">5x</text>
  <circle cx="175" cy="442" r="12" fill="#2ed573" opacity="0.3" stroke="#2ed573"/>
  <text x="175" y="446" text-anchor="middle" fill="#2ed573" font-family="Arial" font-size="7">Fast</text>
  <circle cx="210" cy="442" r="12" fill="#70a1ff" opacity="0.3" stroke="#70a1ff"/>
  <text x="210" y="446" text-anchor="middle" fill="#70a1ff" font-family="Arial" font-size="7">Pro</text>
</svg>