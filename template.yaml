AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  LogSherlock Pro - Serverless Log Analysis Application
  Flask + DynamoDB + S3 on AWS Lambda with API Gateway.

Globals:
  Function:
    Timeout: 300
    MemorySize: 1024
    Runtime: python3.11

Parameters:
  FlaskEnv:
    Type: String
    Default: production
    AllowedValues:
      - production
      - development
    Description: Flask environment mode
  ApiKey:
    Type: String
    Default: ''
    Description: API key for authentication (leave empty to auto-generate)
    NoEcho: true
  TablePrefix:
    Type: String
    Default: LogSherlock
    Description: DynamoDB table name prefix

Resources:
  # ============================================================
  # API Gateway - HTTP API with CORS
  # ============================================================
  LogSherlockApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-API-Key
          - X-Requested-With
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        MaxAge: 600

  # ============================================================
  # Lambda Function - LogSherlock Pro Application
  # ============================================================
  LogSherlockFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: LogSherlockPro
      Handler: lambda_handler.handler
      Runtime: python3.11
      MemorySize: 1024
      Timeout: 300
      Description: LogSherlock Pro - AI-powered log analysis engine
      Environment:
        Variables:
          FLASK_ENV: !Ref FlaskEnv
          STORAGE_BACKEND: dynamodb
          DYNAMODB_TABLE_PREFIX: !Ref TablePrefix
          UPLOAD_FOLDER: /tmp/uploads
          LOG_DIR: /tmp/logs
          S3_BUCKET: !Ref LogSherlockUploads
          LOGSHERLOCK_API_KEY: !Ref ApiKey
          LOGSHERLOCK_DEV_MODE: 'false'
      Policies:
        - S3FullAccessPolicy:
            BucketName: !Ref LogSherlockUploads
        - DynamoDBCrudPolicy:
            TableName: !Ref TicketsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FindingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PatternsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref KnowledgeTable
      Events:
        CatchAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref LogSherlockApi
            Path: /{proxy+}
            Method: ANY
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref LogSherlockApi
            Path: /
            Method: ANY

  # ============================================================
  # DynamoDB Tables
  # ============================================================
  TicketsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${TablePrefix}-Tickets'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: LogSherlockPro

  FindingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${TablePrefix}-Findings'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ticket_id
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: ticket_id
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      Tags:
        - Key: Application
          Value: LogSherlockPro

  PatternsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${TablePrefix}-Patterns'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: name
          AttributeType: S
      KeySchema:
        - AttributeName: name
          KeyType: HASH
      Tags:
        - Key: Application
          Value: LogSherlockPro

  KnowledgeTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${TablePrefix}-Knowledge'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: Application
          Value: LogSherlockPro

  # ============================================================
  # S3 Bucket - Log File Storage
  # ============================================================
  LogSherlockUploads:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteUploadsAfter7Days
            Status: Enabled
            ExpirationInDays: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL for LogSherlock Pro
    Value: !Sub 'https://${LogSherlockApi}.execute-api.${AWS::Region}.amazonaws.com/prod/'
  S3BucketName:
    Description: S3 bucket for uploaded log files
    Value: !Ref LogSherlockUploads
  TicketsTableName:
    Description: DynamoDB Tickets table
    Value: !Ref TicketsTable
  FindingsTableName:
    Description: DynamoDB Findings table
    Value: !Ref FindingsTable
  FunctionArn:
    Description: LogSherlock Lambda Function ARN
    Value: !GetAtt LogSherlockFunction.Arn
