#
# ONE-COMMAND DEPLOY:
#   cd docker
#   docker-compose up -d
#
# With Ollama AI:
#   docker-compose --profile ai up -d
#
# Access:
#   App:    http://localhost:5000
#   Ollama: http://localhost:11434 (if AI profile enabled)
#
# Stop:
#   docker-compose down
#
# Rebuild after code changes:
#   docker-compose up -d --build
#
# View logs:
#   docker-compose logs -f logsherlock
#
# ─────────────────────────────────────────────────────────────────────────────

version: '3.8'

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # LogSherlock Pro — Main Application (455 patterns, 120 known issues)
  # ═══════════════════════════════════════════════════════════════════════════
  logsherlock:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: logsherlock-pro
    ports:
      - "5000:5000"
    environment:
      - LOGSHERLOCK_DEV_MODE=true
      - OLLAMA_HOST=http://ollama:11434
      - FLASK_ENV=production
    volumes:
      - logsherlock_uploads:/app/uploads
      - logsherlock_data:/app/data
      - logsherlock_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - logsherlock-net

  # ═══════════════════════════════════════════════════════════════════════════
  # Ollama — Local AI (OPTIONAL, activate with --profile ai)
  # ═══════════════════════════════════════════════════════════════════════════
  ollama:
    image: ollama/ollama:latest
    container_name: logsherlock-ollama
    profiles:
      - ai
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_ORIGINS=*
    restart: unless-stopped
    # GPU support (uncomment if NVIDIA GPU available)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - logsherlock-net

# ═══════════════════════════════════════════════════════════════════════════════
# Volumes (persistent data survives container restarts)
# ═══════════════════════════════════════════════════════════════════════════════
volumes:
  logsherlock_uploads:
    driver: local
  logsherlock_data:
    driver: local
  logsherlock_logs:
    driver: local
  ollama_models:
    driver: local

# ═══════════════════════════════════════════════════════════════════════════════
# Networks
# ═══════════════════════════════════════════════════════════════════════════════
networks:
  logsherlock-net:
    driver: bridge
