AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  LogSherlock Pro - Serverless Log Analysis Application
  Flask + DynamoDB + S3 on AWS Lambda with API Gateway.

Globals:
  Function:
    Timeout: 300
    MemorySize: 2048
    Runtime: python3.11

Parameters:
  FlaskEnv:
    Type: String
    Default: production
    AllowedValues:
      - production
      - development
    Description: Flask environment mode
  ApiKey:
    Type: String
    Default: ''
    Description: API key for authentication (leave empty to auto-generate)
    NoEcho: true
  TablePrefix:
    Type: String
    Default: LogSherlock
    Description: DynamoDB table name prefix
  GhMonitorToken:
    Type: String
    Default: ''
    Description: GitHub PAT for access monitoring (HPE-log_analysis_app-monitor repo)
    NoEcho: true

Resources:
  # ============================================================
  # API Gateway - HTTP API with CORS
  # ============================================================
  LogSherlockApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod

  # ============================================================
  # Lambda Function - LogSherlock Pro Application
  # ============================================================
  LogSherlockFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: LogSherlockPro
      CodeUri: ../backend/
      Handler: lambda_handler.handler
      Runtime: python3.11
      MemorySize: 2048
      Timeout: 300
      Description: LogSherlock Pro v4.0 - AI-powered log analysis with 172 features
      Environment:
        Variables:
          FLASK_ENV: !Ref FlaskEnv
          STORAGE_BACKEND: dynamodb
          DYNAMODB_TABLE_PREFIX: !Ref TablePrefix
          UPLOAD_FOLDER: /tmp/uploads
          LOG_DIR: /tmp/logs
          S3_BUCKET: !Ref LogSherlockUploads
          LOGSHERLOCK_API_KEY: !Ref ApiKey
          LOGSHERLOCK_DEV_MODE: 'false'
          GH_MONITOR_TOKEN: !Ref GhMonitorToken
      Policies:
        - S3FullAccessPolicy:
            BucketName: !Ref LogSherlockUploads
        - DynamoDBCrudPolicy:
            TableName: !Ref TicketsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FindingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PatternsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref KnowledgeTable
      Events:
        CatchAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref LogSherlockApi
            Path: /{proxy+}
            Method: ANY
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref LogSherlockApi
            Path: /
            Method: ANY

  # ============================================================
  # DynamoDB Tables
  # ============================================================
  TicketsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${TablePrefix}-Tickets'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: LogSherlockPro

  FindingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${TablePrefix}-Findings'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ticket_id
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: ticket_id
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      Tags:
        - Key: Application
          Value: LogSherlockPro

  PatternsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${TablePrefix}-Patterns'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: name
          AttributeType: S
      KeySchema:
        - AttributeName: name
          KeyType: HASH
      Tags:
        - Key: Application
          Value: LogSherlockPro

  KnowledgeTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${TablePrefix}-Knowledge'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: Application
          Value: LogSherlockPro

  # ============================================================
  # DynamoDB - License Activation Table (per-machine locking)
  # ============================================================
  LicensesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${TablePrefix}-Licenses'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: license_key
          AttributeType: S
      KeySchema:
        - AttributeName: license_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Application
          Value: LogSherlockPro

  # ============================================================
  # Lambda - License Activation Service
  # ============================================================
  LicenseFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: LogSherlockLicense
      CodeUri: ./license/
      Handler: license_handler.handler
      Runtime: python3.11
      MemorySize: 256
      Timeout: 10
      Description: LogSherlock Pro - License activation and validation
      Environment:
        Variables:
          LICENSES_TABLE: !Ref LicensesTable
          ADMIN_SECRET: 'LSPRO2026KRISHNA'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LicensesTable
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'
      Events:
        Activate:
          Type: HttpApi
          Properties:
            ApiId: !Ref LogSherlockApi
            Path: /api/license/activate
            Method: ANY
        Validate:
          Type: HttpApi
          Properties:
            ApiId: !Ref LogSherlockApi
            Path: /api/license/validate
            Method: ANY
        Reset:
          Type: HttpApi
          Properties:
            ApiId: !Ref LogSherlockApi
            Path: /api/license/reset
            Method: ANY
        Status:
          Type: HttpApi
          Properties:
            ApiId: !Ref LogSherlockApi
            Path: /api/license/status
            Method: ANY
        ListAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref LogSherlockApi
            Path: /api/license/list-all
            Method: ANY
        BulkRevoke:
          Type: HttpApi
          Properties:
            ApiId: !Ref LogSherlockApi
            Path: /api/license/bulk-revoke
            Method: ANY
        Analytics:
          Type: HttpApi
          Properties:
            ApiId: !Ref LogSherlockApi
            Path: /api/license/analytics
            Method: ANY
        WebhookConfig:
          Type: HttpApi
          Properties:
            ApiId: !Ref LogSherlockApi
            Path: /api/license/webhook-config
            Method: ANY
        AdminUsers:
          Type: HttpApi
          Properties:
            ApiId: !Ref LogSherlockApi
            Path: /api/license/admin-users
            Method: ANY

  # ============================================================
  # S3 Bucket - Log File Storage
  # ============================================================
  LogSherlockUploads:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteUploadsAfter7Days
            Status: Enabled
            ExpirationInDays: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ============================================================
  # CloudFront Distribution - CDN & HTTPS Frontend
  # ============================================================
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: LogSherlock Pro - CloudFront Distribution
        Enabled: true
        HttpVersion: http2and3
        DefaultCacheBehavior:
          TargetOriginId: ApiGatewayOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - POST
            - PATCH
            - DELETE
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled (API responses should not be cached)
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AllViewerExceptHostHeader
          Compress: true
        Origins:
          - Id: ApiGatewayOrigin
            DomainName: !Sub '${LogSherlockApi}.execute-api.${AWS::Region}.amazonaws.com'
            OriginPath: /prod
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        PriceClass: PriceClass_100
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: Application
          Value: LogSherlockPro

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL for LogSherlock Pro
    Value: !Sub 'https://${LogSherlockApi}.execute-api.${AWS::Region}.amazonaws.com/prod/'
  CloudFrontUrl:
    Description: CloudFront distribution URL (use this for production access)
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'
  S3BucketName:
    Description: S3 bucket for uploaded log files
    Value: !Ref LogSherlockUploads
  TicketsTableName:
    Description: DynamoDB Tickets table
    Value: !Ref TicketsTable
  FindingsTableName:
    Description: DynamoDB Findings table
    Value: !Ref FindingsTable
  FunctionArn:
    Description: LogSherlock Lambda Function ARN
    Value: !GetAtt LogSherlockFunction.Arn
